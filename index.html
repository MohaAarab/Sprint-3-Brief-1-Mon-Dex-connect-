<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Dex</title>
  <link rel="icon" type="image/png" href="../src/images/yogiohLogo.png">
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class=" bg-[url('../src/images/yogioh.png')] bg-cover bg-fixed bg-center bg-no-repeat font-body text-ink" >

  <!-- ===================== EN-TÊTE ===================== -->
  <header class="bg-ink text-cream border-b-4 border-brand-light"style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-8 py-5">
      <div class="flex items-center gap-3">
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><title>yu-gi-oh-alt</title><circle cx="25.55" cy="22.55" r="2.87" fill="none" stroke="#ffbb00" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25.55" cy="22.55" r="7.58" fill="none" stroke="#ffbb00" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="#ffbb00" stroke-linecap="round" stroke-linejoin="round" d="M25.55 14.97c6.92 0 10.13 7.19 16.1 7.19h3.78c1.21 0 1.75-.59 1.23-2.37c-.46-1.58-1.67-2.03-4.25-2.03c-7.16 0-7.28-7.2-16.86-7.2s-9.7 7.2-16.86 7.2c-2.58 0-3.79.45-4.25 2.03c-.52 1.78.02 2.37 1.23 2.37h3.78c5.97 0 9.18-7.19 16.1-7.19m19.11 7.19c.99 0 2.39 1.15 2.39 2.82s-.72 2.06-2.12 2.06h-4.31c-3.29 0-3.39 7.63-15.07 7.63s-11.78-7.63-15.07-7.63H6.17c-1.4 0-2.12-.39-2.12-2.06s1.41-2.82 2.39-2.82"/><path fill="none" stroke="#ffbb00" stroke-linecap="round" stroke-linejoin="round" d="M45.62 26.99c-.37 4.27-5.4 17.3-20.07 17.3c-14.67 0-19.7-13.03-20.07-17.3m39.62-8.9C43.09 8.57 33.12 3.7 25.55 3.7S8.02 8.57 6 18.09"/><path fill="none" stroke="#ffbb00" stroke-linecap="round" stroke-linejoin="round" d="M39.13 21.73c-4 .17-1.75 8.4-13.58 8.4s-9.58-8.23-13.58-8.4"/></svg>

        </div>
        <div>
          <p class="font-display text-2xl font-extrabold leading-none">Mon Dex</p>
          <p class="text-sm text-gray-300">Yu-Gi-Oh! · <span id="creature-count">6</span> créatures</p>
        </div>
      </div>
      <nav aria-label="Navigation principale" class="flex flex-wrap gap-2">
        <a href="#grid" class="rounded-full bg-brand border-2 border-brand-light px-4 py-2 hover:bg-cream hover:text-black"style="box-shadow: 0 0 25px rgba(250, 204, 21, 0.6);">Créatures</a>
        <a href="#team" class="rounded-full text-brand bg-ink border-2 border-brand-light px-4 py-2  hover:bg-cream hover:text-black" style="box-shadow: 0 0 25px rgba(250, 204, 21, 0.6);">Mon équipe · <span id="team-count">0</span>/6</a>
        <a href="#create" class="rounded-full bg-brand border-2 border-brand-light px-4 py-2 font-bold text-cream  hover:bg-cream hover:text-black" style="box-shadow: 0 0 25px rgba(250, 204, 21, 0.6);">+ Nouvelle créature</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto flex max-w-7xl flex-col gap-8 px-8 py-8">

    <!-- ===================== RECHERCHE ET FILTRES ===================== -->
    <section aria-label="Recherche et filtres" class="flex flex-col gap-4">
      <div class="flex flex-wrap items-end justify-between gap-4 text-cream">
        <h1 class="font-display text-4xl font-extrabold text-cream">Trouver une créature</h1>

      </div>

      <div id="filters" class="flex flex-col gap-3 m-2 sm:flex-row">
  <label for="search" class="sr-only">Rechercher par nom</label>
  <input id="search" type="search" placeholder="Rechercher un nom..." class="w-full rounded-lg border border-brand-light bg-ink text-cream px-3 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400"
 />

  <label for="typeFilter" class="sr-only">Filtrer par type</label>
  <select id="typeFilter" class="w-full sm:w-64 rounded-lg border border-brand-light bg-ink text-cream px-3 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400"
  >
  <option value="Tous">Tous</option>
  <option value="Monster">Monstres</option>
  <option value="Spell Card">Magie</option>
  <option value="Trap Card">Pièges</option>
  </select>
</div>
    </section>

    <div class="flex flex-col gap-8 lg:flex-row lg:items-start">

      <!-- ===================== GRILLE DES CRÉATURES ===================== -->
      <section id="grid" aria-label="Créatures" class="grid min-w-0 flex-1 grid-cols-1 gap-5  sm:grid-cols-2 xl:grid-cols-3 ">
        <div id="cards-container"></div>
        
      </section>
      <p id="loading" class=" text-brand text-xl"></p>

      <aside class="flex w-full min-w-0 flex-col gap-6 lg:w-[420px] lg:shrink-0">

        <!-- ===================== PANNEAU DE DÉTAIL ===================== -->
         <div id="detail" class="p-0 m-0">
        </div>

        <!-- ===================== MON ÉQUIPE (INCOMPLÈTE) ===================== -->
        <section id="team" aria-label="Mon équipe" class="rounded-card bg-ground p-6 border-4 border-brand-light"style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">
          <div class="flex justify-between">
            <h2 class="font-display text-2xl font-extrabold text-cream">Mon équipe</h2>
          <div id="team-counter" class="border border-brand-light rounded-2xl px-2 py-2 text-brand">0/6</div>
          </div>
        <div id="team-slots" class="grid min-w-0 flex-1 grid-cols-2 gap-5 mt-3 text-center text-cream sm:grid-cols-3"></div>
        <div id="team-msg" class=" text-center text-brand pt-5">no creature</div>
        </section>

      </aside>
    </div>
    <button id="load-more" type="button" class="load-more btn-primary btn-outline bg-brand text-line border-solid border-brand-light mt-auto shadow-[0_0_25px_rgba(250,204,21,0.6)]">charger plus</button>
    <!-- ===================== FORMULAIRE DE CRÉATION ===================== -->
    <section id="create" aria-label="Nouvelle créature" class="flex flex-col gap-6 rounded-card bg-ground border-2 border-brand-light p-8"style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">
      <div>
        <h2 class="font-display text-3xl font-extrabold text-cream">Nouvelle créature</h2>
        <p class="text-muted">Chaque champ est vérifié avant l'ajout de la créature.</p>
      </div>
      <form id="creature-form" novalidate class="grid grid-cols-1 gap-5 text-cream  md:grid-cols-2 lg:grid-cols-4">
        <label class="flex flex-col gap-1 text-sm font-bold " >ID
          <input name="id" id="id" type="text" placeholder="#010" class="field font-normal border border-brand-light bg-ink invalid:" >
          <span id="idError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Nom
          <input name="name" id="name" type="text" placeholder="Nom de la créature" class="field font-normal border border-brand-light bg-ink">
          <span id="nameError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Type
          <select name="type" id="type" class="field font-normal border border-brand-light bg-ink">
            <option value="">Choisir un type</option>
            <option value="Monster">Monstres</option>
            <option value="Spell Card">Magie</option>
            <option value="Trap Card">Pièges</option>
            <option value="Favoris">Favoris</option>
          </select>
          <span id="typeError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label  class="flex flex-col gap-1 text-sm font-bold">Niveau
          <input name="level" id="level" type="text" placeholder="Base, Niveau 1…" class="field font-normal border border-brand-light bg-ink">
          <span id="levelError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <!-- <label class="flex flex-col gap-1 text-sm font-bold">HP
          <input name="stat1" id="hp" type="text" placeholder="0 à 999" class="field font-normal border border-brand-light bg-ink">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label> -->
        <label class="flex flex-col gap-1 text-sm font-bold">Attaque
          <input name="stat2" id="attack" type="text" placeholder="0 à 5000" class="field font-normal border border-brand-light bg-ink">
          <span id="attackError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Defence
          <input name="stat3" id="defence" type="text" placeholder="0 à 5000" class="field font-normal border border-brand-light bg-ink">
          <span id="defenceError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Lien de l'image
          <input name="image" id="img" type="text" placeholder="https://…/image.png" class="field font-normal border border-brand-light bg-ink">
          <span id="imgError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label  class="flex flex-col gap-1 text-sm font-bold md:col-span-2 lg:col-span-4">Description
          <textarea id="description" name="description" rows="3" placeholder="10 à 200 caractères" class="rounded-xl border border-brand-light bg-ink p-3 font-normal outline-none"></textarea>
          <span id="descriptionError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <div class="flex flex-wrap justify-end gap-3 md:col-span-2 lg:col-span-4">
          <button type="reset" class="btn-outline px-6 bg-ground text-cream border border-brand-light hover:text-ink hover:bg-brand">Effacer</button>
          <button type="submit" id="add_creature" class="btn-primary border border-brand-light hover:bg-line "style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">Ajouter la créature</button>
        </div>
      </form>
    </section>

  </main>

  <footer class="mx-auto max-w-7xl px-8 pb-10 text-sm text-muted text-center">
    all rights reserved to MOHAMED AARAB Projet réalisé dans le cadre d'une formation.
  </footer>

  <!-- data.js (à créer) doit être chargé AVANT script.js -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
